name: Tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install --upgrade pip pytest tomli
      - name: Run unit and smoke tests
        run: python -m pytest -q
      - name: Run CLI smoke test
        run: |
          set +e
          python reviewer/main.py . --format json > /tmp/review.json
          code=$?
          test "$code" -eq 0 -o "$code" -eq 1
